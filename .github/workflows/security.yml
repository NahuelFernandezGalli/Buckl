name: Security

on:
  pull_request:
  push:
    branches: [main, develop]
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      deps: ${{ steps.filter.outputs.deps }}
    steps:
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            deps:
              - '.github/workflows/security.yml'
              - 'package.json'
              - 'package-lock.json'
              - 'apps/web/package.json'
              - 'apps/api/global.json'
              - 'apps/api/dotnet-tools.json'
              - 'apps/api/Directory.Packages.props'
              - 'apps/api/Directory.Build.props'
              - 'apps/api/**/*.csproj'

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Dependency audit is a required check, so it is skipped rather than left out. It runs on every
  # push and weekly schedule, and on a pull request whenever a manifest changes or the change
  # detection did not succeed. New advisories against unchanged manifests surface on the schedule.
  deps:
    name: Dependency audit
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.deps == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: apps/api/global.json
      - run: dotnet restore apps/api
      - name: NuGet vulnerability audit
        run: |
          dotnet list apps/api package --vulnerable --include-transitive | tee nuget-audit.txt
          if grep -q "has the following vulnerable packages" nuget-audit.txt; then
            echo "Vulnerable NuGet packages found"
            exit 1
          fi
